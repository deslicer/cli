[package]
name = "deslicer-cli"
version = "1.1.1"
edition = "2021"
rust-version = "1.88"
authors = ["Deslicer <engineering@deslicer.ai>"]
license = "Apache-2.0"
repository = "https://github.com/deslicer/cli"
homepage = "https://deslicer.ai"
description = "Deslicer CLI — vendor-neutral CI client for planning, approving, and shipping Splunk changes via DAP."
keywords = ["deslicer", "splunk", "dap", "cicd", "deploy"]
categories = ["command-line-utilities"]

# Empty workspace table: makes this crate standalone even though it sits inside another workspace dir.
[workspace]

[[bin]]
name = "deslicer"
path = "src/main.rs"

[lib]
name = "deslicer_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
# Bundle source packaging (GitHub-App-free plan flow, REQ-SIGN-008)
tar = "0.4"
flate2 = "1"
# Platform natives are required: keyring 3 defaults to an in-process mock
# that accepts writes and then disappears (the auth-login keychain warning).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
toml = "0.8"

[dev-dependencies]
wiremock = "0.6"
rsa = "0.9"
rand = "0.9"
tempfile = "3"
