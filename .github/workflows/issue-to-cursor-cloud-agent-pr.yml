# Same harness issue→PR lane as deslicer-ai.
# Label an issue `agent:ready` to dispatch a Cursor Cloud Agent.
name: Issue → Cursor Cloud Agent PR

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve-key:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agent:ready')
    runs-on: ubuntu-latest
    outputs:
      api_key_name: ${{ steps.pick.outputs.key_name }}
    steps:
      - id: pick
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          KEY_NAME="$(echo "$ISSUE_AUTHOR" | tr '[:lower:]' '[:upper:]')_CURSOR_CLOUD_API_KEY"
          echo "key_name=$KEY_NAME" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: resolve-key
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: deslicer/deslicer-code-harness/.github/workflows/core_issue_to_cursor_cloud_agent_pr.yml@v1
    with:
      ready_label: agent:ready
      dispatched_label: agent:dispatched
      branch_prefix: cursor/issue
      default_ref: ${{ github.event.repository.default_branch }}
    secrets:
      cursor_cloud_api_key: >-
        ${{
          secrets[needs.resolve-key.outputs.api_key_name]
          || secrets.CURSOR_CLOUD_API_KEY
        }}
