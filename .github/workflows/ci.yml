# Quality gate for deslicer-cli (fmt, clippy, tests, CLI smoke, installer lint).
# auto-fix-ci.yml listens for this workflow by name.

name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DESLICER_GIT_SHA: ${{ github.sha }}

jobs:
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            case "${{ github.ref_name }}" in
              cursor/ci-autofix-automation-*|fix/auto-review-pr-*|automation/*)
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  formatting:
    name: Formatting
    needs: ci-gate
    if: needs.ci-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality-gate-linux

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: ci-gate
    if: needs.ci-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality-gate-linux

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: ci-gate
    if: needs.ci-gate.outputs.proceed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality-gate-test

      - name: Tests
        run: cargo test --all-features

  smoke:
    name: CLI smoke
    needs: ci-gate
    if: needs.ci-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality-gate-linux

      - name: Build debug binary
        run: cargo build

      - name: Smoke --help / --version
        run: |
          set -euo pipefail
          BIN=./target/debug/deslicer
          "$BIN" --help
          "$BIN" --version
          for cmd in auth change acs routine skill catalog remediate groups inventory environments init docs completion update upgrade enroll worker; do
            "$BIN" "$cmd" --help
          done
          for sub in plan show approve reject deploy revert jobs retry verify status; do
            "$BIN" change "$sub" --help
          done
          for sub in stacks credentials observe; do
            "$BIN" acs "$sub" --help
          done
          "$BIN" acs stacks list --help
          "$BIN" acs credentials list --help
          "$BIN" acs credentials test --help
          "$BIN" environments plan-matrix --help
          for sub in list set adopt; do
            "$BIN" environments mappings "$sub" --help
          done
          for sub in list enable disable run runs report; do
            "$BIN" routine "$sub" --help
          done
          for sub in list import; do
            "$BIN" skill "$sub" --help
          done
          for sub in list show plan; do
            "$BIN" catalog "$sub" --help
          done
          for sub in status plan; do
            "$BIN" upgrade "$sub" --help
          done
          for sub in analyse draft; do
            "$BIN" remediate "$sub" --help
          done
          for sub in list ls clone run logs resume repl; do
            "$BIN" agent "$sub" --help
          done
          "$BIN" inventory apps --help
          "$BIN" inventory apps adopt --help
          for sub in create list revoke; do
            "$BIN" enroll "$sub" --help
          done
          "$BIN" worker instructions --help

  installer:
    name: Installer lint
    needs: ci-gate
    if: needs.ci-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck --severity=warning scripts/install.sh scripts/test_install.sh scripts/install-from-source.sh scripts/test_install_from_source.sh scripts/cut-release.sh scripts/test_cut_release.sh

      - name: Installer shell tests
        run: |
          bash scripts/test_install.sh
          bash scripts/test_cut_release.sh
          bash scripts/test_install_from_source.sh

  deny:
    name: Dependency audit (non-blocking)
    needs: ci-gate
    if: needs.ci-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality-gate-linux

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true

      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: true

  quality-gate:
    name: Quality Gate
    needs: [ci-gate, formatting, clippy, test, smoke, installer]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate
        env:
          PROCEED: ${{ needs.ci-gate.outputs.proceed }}
          FORMATTING: ${{ needs.formatting.result }}
          CLIPPY: ${{ needs.clippy.result }}
          TEST: ${{ needs.test.result }}
          SMOKE: ${{ needs.smoke.result }}
          INSTALLER: ${{ needs.installer.result }}
        run: |
          set -euo pipefail
          {
            echo "## Quality Gate"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| proceed | \`$PROCEED\` |"
            echo "| Formatting | \`$FORMATTING\` |"
            echo "| Clippy | \`$CLIPPY\` |"
            echo "| Tests | \`$TEST\` |"
            echo "| CLI smoke | \`$SMOKE\` |"
            echo "| Installer lint | \`$INSTALLER\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROCEED" != "true" ]; then
            echo "Skipped (draft PR or automation branch)."
            exit 0
          fi
          fail=0
          for result in "$FORMATTING" "$CLIPPY" "$TEST" "$SMOKE" "$INSTALLER"; do
            if [ "$result" != "success" ]; then
              fail=1
            fi
          done
          exit "$fail"
