# Publish deslicer-cli to crates.io using Trusted Publishing (OIDC).
#
# Prerequisites (one-time, on crates.io):
#   1. Add deslicer-cli as a crate you maintain.
#   2. Configure Trusted Publishing for github.com/deslicer/cli (this workflow file).
#   3. No CARGO_REGISTRY_TOKEN secret is required — rust-lang/crates-io-auth-action
#      exchanges the GitHub OIDC token for a short-lived crates.io publish token.

name: Crates.io Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: cargo publish
    # Skip prereleases (e.g. v0.1.0-rc.1) — crates.io publishes are permanent.
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Verify crate version matches release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          CRATE_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          EXPECTED="${TAG#v}"
          if [ "${CRATE_VERSION}" != "${EXPECTED}" ]; then
            echo "::error::Cargo.toml version (${CRATE_VERSION}) does not match release tag (${EXPECTED})."
            exit 1
          fi

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish to crates.io
        run: cargo publish -p deslicer-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
