# Same harness review-fix lane as deslicer-ai.
# Comment `@slicer-fix` on a PR (or include it in a review body) to apply review comments.
name: Fix from Review Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: review-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-review:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.comment.body &&
       contains(github.event.comment.body, '@slicer-fix')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.body &&
       contains(github.event.review.body, '@slicer-fix'))
    uses: deslicer/deslicer-code-harness/.github/workflows/core_review_fix.yml@v1
    with:
      model: gpt-5.2
      trigger_keyword: "@slicer-fix"
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
