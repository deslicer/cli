# Same harness review lane as deslicer-ai / DAP.
# Skip docs-only churn — Cursor agent runs cost API credits.
name: Cursor Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    if: github.event.pull_request.draft == false
    uses: deslicer/deslicer-code-harness/.github/workflows/core_cursor_code_review.yml@v1
    with:
      model: ${{ vars.CURSOR_MODEL || 'auto' }}
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
